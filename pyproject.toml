[project]
name = "acorninfer"
version = "0.0.1"
description = "AcornInfer: a from-scratch LLM inference engine. Great oaks from little acorns grow."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "safetensors>=0.4",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "transformers>=4.51",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights / GPU"]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acorninfer*"]
