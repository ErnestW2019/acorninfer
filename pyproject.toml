[project]
name = "suiren"
version = "0.0.1"
description = "Suiren (燧人): a from-scratch LLM inference engine. 钻木取火,取火即取 torch."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "safetensors>=0.4",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "transformers>=4.51",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights / GPU"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["suiren*"]
